name: build-webpanel
on:
  workflow_dispatch:
  push:
    paths:
      - 'webbuild/**'
      - '.github/workflows/build-webpanel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: webbuild
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        working-directory: webbuild
        run: node node_modules/vite/bin/vite.js build --outDir dist

      - name: Verify output
        run: |
          echo "== dist 内容 =="
          ls -la webbuild/dist
          test -f webbuild/dist/index.html || (echo "index.html 缺失" && exit 1)
          echo "== 体积 =="
          du -sh webbuild/dist

      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: webbuild/dist
          retention-days: 7
